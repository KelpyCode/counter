name: Deploy to GitHub Pages

on:
  push:
    branches: [main]           # ← or master, your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2           # ← official Bun action (replaces setup-node)
        with:
          bun-version: latest               # or pin e.g. "1.2.x" if you prefer

      - name: Install dependencies
        run: bun install --frozen-lockfile   # ← Bun's equivalent of npm ci / pnpm install --frozen-lockfile

      - name: Build & Generate
        run: bun run generate                # or bun run build if your scripts use "build"
        env:
          # Optional but recommended — helps set baseURL dynamically if not hardcoded
          NUXT_APP_BASE_URL: ${{ github.event.repository.name && format('/{0}/', github.event.repository.name) || '/' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public               # ← this is where static files land after generate/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4